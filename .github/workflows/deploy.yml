# =====================================================================
#  Publication du site des cours sur GitHub Pages.
#  Cette Action REMPLACE Netlify : à chaque dépôt (push) sur "main",
#  elle relance build.mjs (qui régénère fiches.json en parcourant le
#  dossier fiches/), puis publie tout le site sur GitHub Pages.
#  -> plus de quota Netlify, hébergement gratuit chez GitHub.
#
#  À placer dans le dépôt à ce chemin EXACT :
#      .github/workflows/deploy.yml
# =====================================================================
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # permet aussi de relancer à la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer fiches.json (ce que faisait Netlify)
        run: node build.mjs

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site à publier
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
